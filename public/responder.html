<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fire Responder · Wildfire visitor evacuation</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
      font: 16px/1.5 system-ui, sans-serif;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 12px 12px 32px;
    }

    nav.page-nav {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
    }

    nav.page-nav a.back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 9px 14px;
      background: white;
      color: #111827;
      font-weight: 650;
      text-decoration: none;
    }

    nav.page-nav a.back-link:hover {
      background: #f9fafb;
    }

    header, section {
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: white;
    }

    header { background: #111827; color: white; }
    header p { color: #e5e7eb; }
    section { margin-top: 12px; }
    h1, h2, p { margin: 0 0 8px; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.125rem; }
    .muted { color: #4b5563; font-size: .875rem; }
    .stack { display: grid; gap: 10px; }

    button, textarea { font: inherit; }

    button {
      min-height: 44px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 9px 12px;
      background: white;
      color: #111827;
      font-weight: 650;
      cursor: pointer;
    }

    section > a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 9px 12px;
      background: white;
      color: #111827;
      font-weight: 650;
      text-decoration: none;
    }

    button:disabled { opacity: .65; cursor: wait; }

    .card {
      display: grid;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .card[aria-pressed="true"] {
      border-left: 4px solid #111827;
      background: #f9fafb;
    }

    .primary {
      background: #dc2626;
      border-color: #dc2626;
      color: white;
    }

    label { display: grid; gap: 4px; font-weight: 600; }

    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 9px 12px;
      resize: vertical;
    }

    :focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    #details { overflow-wrap: anywhere; }
    #description { white-space: pre-wrap; }
    #activity { padding-left: 20px; }
    #activity li { margin-bottom: 6px; }

    #progress input,
    #progress select,
    #progress textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: #fff;
      color: #111827;
      font: inherit;
    }
    
    #progress label {
      display: grid;
      gap: 8px;
      font-weight: 600;
    }

    #progress textarea {
      resize: vertical;
    }
    #activity li {
      white-space: pre-line;
    }

    #create-incident input,
    #create-incident select,
    #create-incident textarea {
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: white;
      color: #111827; 
      font: inherit;
    }

    #report-location-map {
      width: 100%;
      height: 240px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      overflow: hidden;
      z-index: 0;
    }

    .coordinate-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    #incidents .card {
      border-left: 5px solid var(--incident-colour, #6b7280);
    }

    #incidents .card[aria-pressed="true"] {
      border-color: var(--incident-colour, #6b7280);
      background: #f9fafb;
    }

    @media (max-width: 360px) {
      .coordinate-fields {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >
</head>

<body>
  <main>
    <nav class="page-nav" aria-label="Primary navigation">
      <a href="./index.html" class="back-link" aria-label="Back to shared map">← Back to map</a>
    </nav>

    <header>
      <h1>Fire Responder</h1>
      <p>Wildfire visitor evacuation</p>
      <p id="connection" role="status">Connecting…</p>
    </header>

    <section aria-labelledby="create-heading">
      <h2 id="create-heading">Report an incident</h2>

      <form id="create-incident" class="stack">
         <label>
          Your name
          <input
            name="authorName"
            type="text"
            required
            autocomplete="name"
            placeholder="Enter your name"
          >
        </label>

        <label>
          Incident title
          <input
            name="incidentTitle"
            type="text"
            required
            maxlength="120"
            placeholder="e.g. Additional crew needed near Aberfoyle"
          >
        </label>

        <label>
          Location description
          <input
            name="locationName"
            type="text"
            required
            placeholder="e.g. Visitor car park near Aberfoyle"
          >
        </label>

        <p class="muted">
          Tap the map to place a pin. Drag the pin or tap again to adjust it.
        </p>

        <div
          id="report-location-map"
          aria-label="Choose incident location"
        ></div>

        <div class="coordinate-fields">
          <label>
            Latitude
            <input
              name="lat"
              type="number"
              min="-90"
              max="90"
              step="any"
              required
            >
          </label>

          <label>
            Longitude
            <input
              name="lng"
              type="number"
              min="-180"
              max="180"
              step="any"
              required
            >
          </label>
        </div>

        <p id="report-location-status" class="muted" role="status">
          No location selected.
        </p>

        <label>
          Severity
          <select name="severity" required>
            <option>Low</option>
            <option selected>Moderate</option>
            <option>High</option>
            <option>Critical</option>
          </select>
        </label>

        <label>
          Incident details / assistance needed
          <textarea
            name="description"
            rows="3"
            required
            placeholder="Describe the situation and any assistance needed"
          ></textarea>
        </label>

        <button type="submit" class="primary">Submit report</button>

        <p id="create-feedback" role="status"></p>
      </form>
    </section>

    <section aria-labelledby="incident-heading">
      <h2 id="incident-heading">Shared incidents</h2>
      <a href="./index.html?from=responder">Open shared map</a>
      <p id="list-message" class="muted" role="status">Loading incidents…</p>
      <div id="incidents" class="stack"></div>
    </section>

    <section id="details" aria-labelledby="title" hidden>
      <h2 id="title"></h2>
      <p id="summary"></p>
      <p id="source" class="muted"></p>
      <p id="description"></p>

      <h2>Activity log</h2>
      <ul id="activity"></ul>

      <form id="progress" class="stack">
        <label for="responder-name">Your name</label>
        <input
        id="responder-name"
        name="responderName"
        type="text"
        required
        placeholder="Enter your name"
        autocomplete="name"
        >
        <label>
          Incident status
          <select name="status" required>
            <option value="Active">Active</option>
            <option value="Decision Pending">Decision Pending</option>
            <option value="Resolved">Resolved</option>
          </select>
        </label>
        
        <label>
          Severity
          <select name="severity" required>
            <option value="Low">Low</option>
            <option value="Moderate">Moderate</option>
            <option value="High">High</option>
            <option value="Critical">Critical</option>
          </select>
        </label>
        
        <label>
          Action required
          <textarea
          name="actionRequired"
          rows="3"
          placeholder="e.g. Guide visitors from the car park to the agreed assembly point"
        ></textarea>
      </label>
      
      <label>
        Progress update / outcome
        <textarea
        name="note"
        rows="3"
        placeholder="Describe actions taken or the latest outcome"
      ></textarea>
    </label>
    <button type="submit" class="primary">Share update</button>
  </form>

      <p id="feedback" role="status"></p>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const get = id => document.getElementById(id);
    const form = get('progress');
    const feedback = get('feedback');

    let incidents = [];
    let selectedId = null;
    let revision = 0;
    let saving = false;
    let formBaseline = {};
    
    const editableFields = [
      'status',
      'severity',
      'actionRequired'
    ];
    
    function incidentFieldValue(event, field) {
      return event[field] || '';
    }
    
    function fillUpdateForm(event) {
      formBaseline = {};
      
      for (const field of editableFields) {
        const value = incidentFieldValue(event, field);
        
        form.elements[field].value = value;
        formBaseline[field] = value;
      }
      
      form.elements.note.value = '';
    }

    function syncUpdateForm(event) {
      if (saving) return;
      
      for (const field of editableFields) {
        const input = form.elements[field];
        const latestValue = incidentFieldValue(event, field);

        if (input.value === formBaseline[field]) {
          input.value = latestValue;
          formBaseline[field] = latestValue;
        }
      }
    }

    function appendText(parent, tag, value, className = '') {
      const element = document.createElement(tag);
      element.className = className;
      element.textContent = value;
      parent.append(element);
    }

    function formatTime(timestamp) {
      return new Date(timestamp).toLocaleTimeString('en-GB', {
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function render() {
      const list = get('incidents');
      const selected = incidents.find(event => event.id === selectedId);
      const activeId = document.activeElement?.dataset.eventId;

      list.replaceChildren();
      get('list-message').textContent =
        incidents.length ? '' : 'No incidents reported.';

      for (const event of incidents) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'card';
        const severityColours = {
          Critical: '#dc2626',
          High: '#ea580c',
          Moderate: '#eab308',
          Low: '#16a34a'
        };
        
        const colour = event.status === 'Resolved'
          ? '#2563eb'
          : severityColours[event.severity] || '#6b7280';
        
        button.style.setProperty('--incident-colour', colour);
        button.dataset.eventId = event.id;
        button.setAttribute('aria-pressed', String(event.id === selectedId));

        appendText(button, 'strong', event.title);
        appendText(button, 'span', event.location.name, 'muted');
        appendText(button, 'span', `${event.severity} · ${event.status}`, 'muted');

        button.addEventListener('click', () => {
          if (saving) return;
          const changedSelection = event.id !== selectedId;
          
          selectedId = event.id;
          render();
          
          if (changedSelection) {
            fillUpdateForm(event);
            feedback.textContent = '';
          }
        });
        
        list.append(button);
        if (event.id === activeId) button.focus({ preventScroll: true });
      }

      get('details').hidden = !selected;
      if (!selected) return;

      get('title').textContent = selected.title;
      get('summary').textContent =
        `${selected.location.name} · ${selected.severity} · ${selected.status}`;
      get('source').textContent =
        `Reported by ${selected.authorName} at ${formatTime(selected.timestamp)}`;
      get('description').textContent = selected.description || '';

      const activity = get('activity');
      const updates = selected.updates || [];
      activity.replaceChildren();

      if (!updates.length) appendText(activity, 'li', 'No updates logged yet.');

      for (const update of updates) {
        appendText(
          activity,
          'li',
          `${formatTime(update.timestamp)} · ${update.author} · ${update.text}`
        );
      }
    }

    function receiveEvents(events) {
      revision += 1;
      incidents = events;
      
      const selected = incidents.find(event => event.id === selectedId);
      
      if (selected) {
        syncUpdateForm(selected);
      }
      render();
    }

    async function loadIncidents() {
      const before = revision;

      try {
        const response = await fetch('/api/events', { cache: 'no-store' });
        if (!response.ok) throw new Error('Could not load incidents');

        const events = await response.json();
        if (revision === before) receiveEvents(events);
      } catch {
        if (revision === before) {
          get('list-message').textContent =
            'Could not load incidents. Check the project server.';
        }
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      
      if (saving) return;
      const id = selectedId;
      if (!id) return;
      
      const authorName =
        document.getElementById('responder-name').value.trim();
      
      if (!authorName) {
        feedback.textContent = 'Enter your name before sharing an update.';
        document.getElementById('responder-name').focus();
        return;
      }
      
      const payload = {
        author: authorName,
        department: 'Scottish Fire and Rescue Service'
      };
      
      let hasChanges = false;
      
      for (const field of editableFields) {
        const value = field === 'actionRequired'
          ? form.elements[field].value.trim()
          : form.elements[field].value;
        
        if (value !== formBaseline[field]) {
          payload[field] = value;
          hasChanges = true;
        }
      }
      
      const note = form.elements.note.value.trim();
      
      if (note) {
        payload.updateText = note;
        hasChanges = true;
      }
      
      if (!hasChanges) {
        feedback.textContent = 'Make a change or enter a progress update.';
        return;
      }
      
      const button = form.querySelector('button[type="submit"]');
      const controls = Array.from(form.elements);
      
      saving = true;
      controls.forEach(control => {
        control.disabled = true;
      });
      
      feedback.textContent = 'Sharing update…';
      
      try {
        const response = await fetch(
          `/api/events/${encodeURIComponent(id)}`,
          {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }
        );
        
        const result = await response.json();
        
        if (!response.ok) {
          throw new Error(result.error || 'Update rejected.');
        }
        
        if (selectedId === id) {
          fillUpdateForm(result);
          feedback.textContent = 'Update shared successfully.';
        }
        
        await loadIncidents();
      } catch (error) {
        feedback.textContent =
          `Could not confirm the update. ${error.message}`;
      } finally {
        saving = false;
        
        controls.forEach(control => {
          control.disabled = false;
        });
        button.disabled = false;
      }
    });

    if (typeof io === 'function') {
      const socket = io();

      socket.on('connect', () => {
        get('connection').textContent = 'Live updates connected';
      });

      socket.on('init_state', state => receiveEvents(state.events || []));
      socket.on('timeline_updated', receiveEvents);

      socket.on('disconnect', () => {
        get('connection').textContent = 'Live updates disconnected';
      });

      socket.on('connect_error', () => {
        get('connection').textContent = 'Could not connect to live updates';
      });
    } else {
      get('connection').textContent = 'Live updates unavailable';
    }

    const createForm = get('create-incident');
    const createFeedback = get('create-feedback');
    const locationFeedback = get('report-location-status');

    let reportMap = null;
    let reportPin = null;
    let creatingIncident = false;

    function validReportCoordinates(lat, lng) {
      return Number.isFinite(lat) &&
        Number.isFinite(lng) &&
        lat >= -90 && lat <= 90 &&
        lng >= -180 && lng <= 180;
    }

    function setReportLocation(lat, lng, moveMap = false) {
      if (!validReportCoordinates(lat, lng)) return;

      createForm.elements.lat.value = lat.toFixed(6);
      createForm.elements.lng.value = lng.toFixed(6);

      locationFeedback.textContent =
        `Selected location: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;

      if (!reportMap) return;

      if (!reportPin) {
        reportPin = L.marker([lat, lng], {
          draggable: true,
          autoPan: true,
          title: 'New incident location'
        }).addTo(reportMap);

        reportPin.on('dragend', () => {
          const point = reportPin.getLatLng();
          setReportLocation(point.lat, point.lng);
        });
      } else {
        reportPin.setLatLng([lat, lng]);
      }

      if (moveMap) {
        reportMap.setView([lat, lng], reportMap.getZoom());
      }
    }

    if (typeof L !== 'undefined') {
      reportMap = L.map('report-location-map')
        .setView([56.205, -4.33], 12);

      L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors'
        }
      ).addTo(reportMap);

      reportMap.on('click', event => {
        setReportLocation(event.latlng.lat, event.latlng.lng);
      });
    } else {
      locationFeedback.textContent =
        'Map unavailable. Enter coordinates in the fields above.';
    }

    function useReportCoordinates() {
      const latText = createForm.elements.lat.value;
      const lngText = createForm.elements.lng.value;

      if (!latText || !lngText) return;

      const lat = Number(latText);
      const lng = Number(lngText);

      if (validReportCoordinates(lat, lng)) {
        setReportLocation(lat, lng, true);
      } else {
        locationFeedback.textContent = 'Enter valid coordinates.';
      }
    }

    createForm.elements.lat.addEventListener(
      'change',
      useReportCoordinates
    );

    createForm.elements.lng.addEventListener(
      'change',
      useReportCoordinates
    );

    createForm.addEventListener('submit', async event => {
      event.preventDefault();

      if (creatingIncident) return;

      const fields = new FormData(createForm);

      const authorName = fields.get('authorName').trim();
      const title = fields.get('incidentTitle').trim();
      const locationName = fields.get('locationName').trim();
      const description = fields.get('description').trim();

      const latText = fields.get('lat');
      const lngText = fields.get('lng');
      const lat = Number(latText);
      const lng = Number(lngText);

      if (!authorName || !title || !locationName || !description) {
        createFeedback.textContent = 'Complete the report fields.';
        return;
      }

      if (
        !latText ||
        !lngText ||
        !validReportCoordinates(lat, lng)
      ) {
        createFeedback.textContent =
          'Choose a valid location on the map or enter coordinates.';
        return;
      }

      const payload = {
        title,
        description,
        locationName,
        lat,
        lng,
        severity: fields.get('severity'),
        department: 'Scottish Fire and Rescue Service',
        authorName,
        authorRole: 'Fire Responder'
      };

      const controls = Array.from(createForm.elements);

      creatingIncident = true;
      controls.forEach(control => {
        control.disabled = true;
      });

      createFeedback.textContent = 'Submitting report…';

      try {
        const response = await fetch('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error('The server rejected the report.');
        }

        const saved = await response.json();

        createForm.reset();
        createForm.elements.authorName.value = authorName;

        if (reportPin && reportMap) {
          reportMap.removeLayer(reportPin);
          reportPin = null;
        }

        locationFeedback.textContent = 'No location selected.';
        createFeedback.textContent = `Report submitted · ${saved.title}`;

        await loadIncidents();
      } catch {
        createFeedback.textContent =
          'Could not confirm submission. Check the incident list before retrying.';
      } finally {
        creatingIncident = false;

        controls.forEach(control => {
          control.disabled = false;
        });
      }
    });

    loadIncidents();
  </script>
</body>
</html>
