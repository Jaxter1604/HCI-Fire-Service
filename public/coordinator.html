<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coordinator · Wildfire visitor evacuation</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main { max-width: 620px; margin: auto; padding: 12px 12px 32px; }
    h1, h2, p { margin: 0 0 8px; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.125rem; }

    header, section, details {
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: white;
    }

    header { border-color: #111827; background: #111827; color: white; }
    header p { color: #e5e7eb; }
    section, details { margin-top: 12px; }
    summary { font-weight: 650; cursor: pointer; }
    .muted { color: #4b5563; font-size: .875rem; }
    .stack { display: grid; gap: 10px; }

    button, select, textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 9px 11px;
      background: white;
      color: #111827;
      font: inherit;
    }

    button { cursor: pointer; font-weight: 650; }
    button:disabled { opacity: .65; cursor: wait; }
    button:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 2px;
    }

    .dark { background: #111827; color: white; border-color: #111827; }
    .primary { background: #dc2626; color: white; border-color: #dc2626; }
    .card { display: grid; gap: 3px; text-align: left; overflow-wrap: anywhere; }
    .card[data-severity="Critical"] { border-left: 4px solid #dc2626; }
    .card[data-severity="High"] { border-left: 4px solid #f97316; }
    #teams { padding-left: 20px; }

    #map { width: 100%; height: 180px; border-radius: 8px; }
    #map-dialog {
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
    }

    #map-dialog[open] {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    #map-dialog #map { height: 100%; border-radius: 0; }
    .map-toolbar { padding: 10px 12px; background: #111827; }
    .map-toolbar button { width: auto; }

    #incident-dialog {
      width: min(560px, calc(100% - 24px));
      max-height: 85dvh;
      padding: 18px;
      border: 0;
      border-radius: 14px;
      color: #111827;
    }

    .map-link {
      display: grid;
      place-items: center;
      min-height: 44px;
      border-radius: 8px;
      font-weight: 650;
      text-decoration: none;
    }

    dialog::backdrop { background: rgb(17 24 39 / 55%); }
    form { margin-top: 14px; }
    label { display: grid; gap: 4px; font-weight: 600; }
    textarea { resize: vertical; font-weight: 400; }
    #activity { padding-left: 20px; }
    #activity li { margin-bottom: 6px; overflow-wrap: anywhere; }
    #incident-description { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Coordinator</h1>
      <p>Wildfire visitor evacuation</p>
      <p id="connection" role="status">Connecting…</p>
    </header>

    <section class="stack" aria-labelledby="map-heading">
      <h2 id="map-heading">Shared map</h2>
      <div id="map-preview">
        <div id="map" aria-label="Shared incident map"></div>
      </div>
      <a class="dark map-link" href="./index.html?from=coordinator">Open map</a>
      <p id="map-message" class="muted" role="status" hidden></p>
    </section>

    <section class="stack" aria-labelledby="overview-heading">
      <h2 id="overview-heading">Task overview</h2>
      <label>
        Incident status
        <select id="status-filter">
          <option value="">All incidents</option>
          <option>Active</option>
          <option>Decision Pending</option>
          <option>Resolved</option>
        </select>
      </label>
      <p id="list-message" class="muted" role="status">Loading incidents…</p>
      <div id="incident-list" class="stack"></div>
    </section>

    <details>
      <summary>Rescue teams and resources</summary>
      <ul id="teams"></ul>
    </details>
  </main>

  <dialog id="map-dialog" aria-label="Expanded shared map">
    <div class="map-toolbar">
      <button type="button" id="close-map" autofocus>Close map</button>
    </div>
  </dialog>

  <dialog id="incident-dialog" aria-labelledby="incident-title">
    <h2 id="incident-title"></h2>
    <p id="incident-meta" class="muted"></p>
    <p id="incident-description"></p>

    <h2>Activity log</h2>
    <ul id="activity"></ul>

    <form id="update-form" class="stack">
      <label>
        Update incident status
        <select name="status">
          <option>Active</option>
          <option>Decision Pending</option>
          <option>Resolved</option>
        </select>
      </label>

      <label>
        Action note
        <textarea name="note" rows="2" placeholder="Record a coordination update"></textarea>
      </label>

      <button type="submit" class="primary">Log update</button>
      <p id="update-feedback" class="muted" role="status"></p>
      <button type="button" id="close-incident">Close details</button>
    </form>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const get = id => document.getElementById(id);
    const mapElement = get('map');
    const mapDialog = get('map-dialog');
    const incidentDialog = get('incident-dialog');
    const updateForm = get('update-form');

    let incidents = [];
    let resources = [];
    let selectedId = null;
    let eventsVersion = 0;

    function addText(parent, tag, text, className = '') {
      const element = document.createElement(tag);
      element.textContent = text;
      if (className) element.className = className;
      parent.append(element);
      return element;
    }

    function formatTime(timestamp) {
      return new Date(timestamp).toLocaleTimeString('en-GB', {
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    const map = typeof L === 'undefined'
      ? null
      : L.map(mapElement).setView([56.21, -4.32], 11);

    const markers = map ? L.layerGroup().addTo(map) : null;

    if (map) {
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
    } else {
      get('open-map').disabled = true;
      mapElement.hidden = true;
      get('map-message').hidden = false;
      get('map-message').textContent = 'Map unavailable. Open an incident from the list below.';
    }

    function drawMarkers(visibleIncidents) {
      if (!markers) return;
      markers.clearLayers();

      for (const event of visibleIncidents) {
        const { lat, lng } = event.location;
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;

        const marker = L.marker([lat, lng], { title: event.title })
          .addTo(markers);

        const label = document.createElement('span');
        label.textContent = event.title;
        marker.bindTooltip(label);
        marker.on('click', () => openIncident(event.id));
      }

      for (const team of resources) {
        if (!Number.isFinite(team.lat) || !Number.isFinite(team.lng)) continue;

        const label = document.createElement('span');
        label.textContent = `${team.name} · ${team.status}`;

        L.circleMarker([team.lat, team.lng], {
          radius: 6,
          color: '#111827',
          fillColor: '#111827',
          fillOpacity: 1
        }).addTo(markers).bindTooltip(label);
      }
    }

    function renderOverview() {
      const filter = get('status-filter').value;
      const visible = incidents.filter(event => !filter || event.status === filter);
      const list = get('incident-list');
      const teams = get('teams');

      list.replaceChildren();
      teams.replaceChildren();
      get('list-message').textContent = visible.length ? '' : 'No matching incidents.';

      for (const event of visible) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'card';
        button.dataset.severity = event.severity;
        addText(button, 'strong', event.title);
        addText(button, 'span', event.location.name, 'muted');
        addText(button, 'span', `${event.severity} · ${event.status}`, 'muted');
        button.addEventListener('click', () => openIncident(event.id));
        list.append(button);
      }

      for (const team of resources) {
        addText(teams, 'li', `${team.name} · ${team.status}`);
      }

      if (!resources.length) addText(teams, 'li', 'No resources reported.');
      drawMarkers(visible);
    }

    function renderIncident(event) {
      get('incident-title').textContent = event.title;
      get('incident-meta').textContent =
        `${event.location.name} · ${event.severity} · ${event.status} · ` +
        `Reported by ${event.authorName} at ${formatTime(event.timestamp)}`;
      get('incident-description').textContent = event.description || '';

      const activity = get('activity');
      activity.replaceChildren();

      if (!event.updates.length) addText(activity, 'li', 'No updates logged yet.');

      for (const update of event.updates) {
        addText(activity, 'li',
          `${formatTime(update.timestamp)} · ${update.author} · ${update.text}`);
      }
    }

    function openIncident(id) {
      const event = incidents.find(item => item.id === id);
      if (!event) return;

      selectedId = id;
      updateForm.reset();
      updateForm.elements.status.value = event.status;
      get('update-feedback').textContent = '';
      renderIncident(event);
      incidentDialog.showModal();
    }

    function receiveIncidents(events) {
      eventsVersion += 1;
      incidents = events;
      renderOverview();

      const selected = incidents.find(item => item.id === selectedId);
      if (incidentDialog.open && selected) renderIncident(selected);
    }

    get('close-incident').addEventListener('click', () => incidentDialog.close());
    incidentDialog.addEventListener('close', () => { selectedId = null; });
    get('status-filter').addEventListener('change', renderOverview);

    async function readJson(path) {
      const response = await fetch(path, { cache: 'no-store' });
      if (!response.ok) throw new Error('Request failed');
      return response.json();
    }

    async function loadOverview() {
      const requestedVersion = eventsVersion;
      const [eventsResult, resourcesResult] = await Promise.allSettled([
        readJson('/api/events'),
        readJson('/api/resources')
      ]);

      if (resourcesResult.status === 'fulfilled') {
        resources = resourcesResult.value;
        renderOverview();
      }

      if (requestedVersion !== eventsVersion) return;

      if (eventsResult.status === 'fulfilled') {
        receiveIncidents(eventsResult.value);
      } else {
        get('list-message').textContent = 'Could not load incidents. Check the project server.';
      }
    }

    updateForm.addEventListener('submit', async event => {
      event.preventDefault();
      const id = selectedId;
      if (!id) return;

      const fields = new FormData(updateForm);
      const button = updateForm.querySelector('[type="submit"]');
      const feedback = get('update-feedback');
      button.disabled = true;
      feedback.textContent = 'Saving…';

      try {
        const response = await fetch(`/api/events/${encodeURIComponent(id)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            status: fields.get('status'),
            updateText: fields.get('note').trim(),
            author: 'Evacuation Coordinator',
            department: 'Multi-Agency'
          })
        });

        if (!response.ok) throw new Error('Update rejected');
        const saved = await response.json();

        receiveIncidents(incidents.map(item => item.id === id ? saved : item));

        if (selectedId === id) {
          updateForm.elements.note.value = '';
          feedback.textContent = 'Update saved.';
        }
      } catch {
        if (selectedId === id) feedback.textContent = 'Could not confirm the update.';
      } finally {
        button.disabled = false;
      }
    });

    if (typeof io === 'function') {
      const socket = io();

      socket.on('connect', () => {
        get('connection').textContent = 'Live updates connected';
      });

      socket.on('init_state', state => {
        resources = state.resources || [];
        receiveIncidents(state.events || []);
      });

      socket.on('timeline_updated', receiveIncidents);

      socket.on('disconnect', () => {
        get('connection').textContent = 'Live updates disconnected';
      });

      socket.on('connect_error', () => {
        get('connection').textContent = 'Could not connect to live updates';
      });
    } else {
      get('connection').textContent = 'Live updates unavailable';
    }

    loadOverview();
  </script>
</body>
</html>
